title = "Krepre"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# Bundle files are published only when a template uses them, so original photos (with EXIF) stay private.
[cascade.build]
publishResources = false

[outputs]
home = ["html"]
page = ["html"]
section = ["html"]

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

# Lets the image render hook output a figure with a caption for a picture on its own line.
[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[markup.highlight]
codeFences = false

[params]
